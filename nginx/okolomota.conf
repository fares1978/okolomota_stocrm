# Nginx site for the okolomota service. Deployed to /etc/nginx/sites-available/okolomota.
# Only the webhook and /health are exposed; everything else (including /process,
# /docs, /openapi.json) returns 404.

limit_req_zone $binary_remote_addr zone=okolomota_webhook:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Let's Encrypt IP-address certificate (short-lived, ~6 days; renewed by the
    # certbot-renew timer, which reloads Nginx through a deploy hook).
    ssl_certificate     /etc/letsencrypt/live/45.80.70.196/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/45.80.70.196/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # No HSTS: browsers ignore it for bare IP addresses. Add it when a domain is used.

    location = /okolomota-ctosrm/webhook/add-offer {
        limit_req zone=okolomota_webhook burst=20 nodelay;
        limit_except POST { deny all; }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Let's Encrypt HTTP-01 validation files (certbot --webroot /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
